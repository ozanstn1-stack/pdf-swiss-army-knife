name: Android

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APKs
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK and platform tools
        run: |
          sdkmanager --install "ndk;27.3.13750724" "platforms;android-36" "build-tools;36.0.0"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.3.13750724" >> "$GITHUB_ENV"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-android-${{ hashFiles('**/Cargo.lock') }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Configure release signing
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > src-tauri/gen/android/pdfsak-release.jks
          {
            echo "storeFile=pdfsak-release.jks"
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
          } > src-tauri/gen/android/keystore.properties

      - name: Fetch Android engines
        run: pwsh -NoProfile -File scripts/fetch-engines-android.ps1 -Abis arm64-v8a,armeabi-v7a

      - name: Build arm64 APK
        run: npm run tauri android build -- --apk --ci --target aarch64

      - name: Build armv7 APK
        run: npm run tauri android build -- --apk --ci --target armv7

      - name: Collect APKs
        run: |
          set -e
          mkdir -p release-artifacts
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          cp "$(find src-tauri/gen/android/app/build/outputs/apk/arm64/release -name '*.apk' | head -n1)" \
             "release-artifacts/PDF-Swiss-Army-Knife-Android-$version-arm64-v8a.apk"
          cp "$(find src-tauri/gen/android/app/build/outputs/apk/arm/release -name '*.apk' | head -n1)" \
             "release-artifacts/PDF-Swiss-Army-Knife-Android-$version-armeabi-v7a.apk"
          ls -lh release-artifacts

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: release-artifacts/*.apk
          if-no-files-found: error

      - name: Attach APKs to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" release-artifacts/*.apk --clobber
